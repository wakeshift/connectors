name: npm

# Publishes a release's npm packages: @wakeshift/connect-<os>-<arch> (the
# connector for each platform), @wakeshift/connect (npx -y @wakeshift/connect
# <harness>), @wakeshift/opencode (the plugin for opencode) and
# @wakeshift/openclaw (the plugin for OpenClaw).
#
# They're built in Wakeshift's private repository with the rest of the
# installers' release (its installers.yml, from the same binaries) and
# published here as files of this repository's release, under the
# Sigstore-signed SHA256SUMS. This workflow checks that signature (made by
# wakeshift/wakeshift's installers.yml at this release's tag) and the
# checksums, then publishes exactly those tarballs with npm's trusted
# publishing: npm trusts this workflow's OIDC token, so no npm token is
# stored here, and records provenance, which needs a public repository.
#
# A release runs it once published; workflow_dispatch runs it again for a
# tag (a version already on npm is skipped).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (v1.5.0)
        required: true

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Check the release's packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The tag is a release's
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "$TAG isn't a release tag (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
      - name: Download them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'wakeshift-connect-*.tgz' --pattern 'wakeshift-opencode-*.tgz' --pattern 'wakeshift-openclaw-*.tgz' \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the signature and the checksums
        working-directory: dist
        run: |
          set -eu
          # Signed by Wakeshift's installers workflow, at this very tag.
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/wakeshift/wakeshift/.github/workflows/installers.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          v=${TAG#v}
          want="wakeshift-connect-darwin-arm64-$v.tgz wakeshift-connect-darwin-x64-$v.tgz wakeshift-connect-linux-arm64-$v.tgz wakeshift-connect-linux-x64-$v.tgz wakeshift-connect-$v.tgz wakeshift-opencode-$v.tgz wakeshift-openclaw-$v.tgz"
          for f in $want; do
            test -f "$f" || { echo "the release has no $f" >&2; exit 1; }
            grep -q "  $f\$" SHA256SUMS || { echo "SHA256SUMS doesn't list $f" >&2; exit 1; }
          done
          extra=$(ls wakeshift-*.tgz | grep -vxF -f <(printf '%s\n' $want) || true)
          if [ -n "$extra" ]; then echo "unexpected files: $extra" >&2; exit 1; fi
          grep -E '  wakeshift-(connect|opencode|openclaw)-' SHA256SUMS | sha256sum -c -
          # Each is the package and version its name says.
          for f in $want; do
            tar -xzOf "$f" package/package.json | node -e '
              const j = JSON.parse(require("fs").readFileSync(0, "utf8")), [f, v] = process.argv.slice(1);
              const name = "@wakeshift/" + f.replace(/^wakeshift-/, "").replace("-" + v + ".tgz", "");
              if (j.name !== name || j.version !== v) { console.error(f + " is " + j.name + "@" + j.version); process.exit(1); }
              if (j.scripts && Object.keys(j.scripts).length) { console.error(f + " has scripts"); process.exit(1); }
            ' "$f" "$v"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: dist/wakeshift-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npmjs.com's trusted publisher for each package names this repository,
    # this workflow (npm.yml) and this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@wakeshift/connect
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm supports trusted publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g --ignore-scripts --no-fund --no-audit npm@11.12.1
          fi
          npm --version
      - name: Publish, platform packages first, with provenance
        run: |
          set -eu
          v=${TAG#v}
          # A prerelease (1.6.0-rc.1) doesn't become latest.
          case "$v" in
          *-*) dist_tag=next ;;
          *) dist_tag=latest ;;
          esac
          for p in connect-darwin-arm64 connect-darwin-x64 connect-linux-arm64 connect-linux-x64 connect opencode openclaw; do
            if [ "$(npm view "@wakeshift/$p@$v" version 2>/dev/null || true)" = "$v" ]; then
              echo "@wakeshift/$p@$v is published already"
              continue
            fi
            # ./ first: npm reads "dist/x.tgz" as the GitHub repository dist/x.tgz.
            npm publish "./dist/wakeshift-$p-$v.tgz" --provenance --access public --tag "$dist_tag"
          done
